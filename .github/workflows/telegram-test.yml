# Temporary: sends one test message with the Upptime Telegram secrets, then gets deleted.
name: Telegram notification test
on: workflow_dispatch
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send a test message
        env:
          BOT_KEY: ${{ secrets.NOTIFICATION_TELEGRAM_BOT_KEY }}
          CHAT_ID: ${{ secrets.NOTIFICATION_TELEGRAM_CHAT_ID }}
          ENABLED: ${{ secrets.NOTIFICATION_TELEGRAM }}
        run: |
          echo "NOTIFICATION_TELEGRAM=$ENABLED"
          [ -n "$BOT_KEY" ] && echo "bot key: set" || echo "bot key: MISSING"
          [ -n "$CHAT_ID" ] && echo "chat id: set" || echo "chat id: MISSING"
          res=$(curl -s -X POST "https://api.telegram.org/bot${BOT_KEY}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=✅ Upptime test from status.cyphera.my.id: Telegram notifications are working. You will get a message here when a monitored site goes down or comes back up.")
          ok=$(echo "$res" | python3 -c "import sys,json; d=json.load(sys.stdin); print('ok' if d.get('ok') else 'error: ' + str(d.get('error_code')) + ' ' + str(d.get('description')))")
          echo "Telegram API: $ok"
          [ "$ok" = "ok" ]
